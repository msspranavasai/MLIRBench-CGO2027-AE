name: Verify rc6 candidate on native CPUs
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-reviewer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Record native host and verify frozen source
        run: |
          uname -a
          docker version
          python3 -B release_tools/verify_distribution.py --source-only
      - name: Build this exact source without publishing
        run: |
          ID="$(PYTHONDONTWRITEBYTECODE=1 python3 tools/release/source_identity.py)"
          PACKAGE_SHA="$(python3 -B tools/release/package_image_identity.py)"
          docker build --platform 'linux/${{ matrix.arch }}' \
            --label "org.mlirbench.source-fingerprint=$ID" \
            --label "org.mlirbench.package-metadata-sha256=$PACKAGE_SHA" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label org.opencontainers.image.version=0.3.0rc6 \
            --label org.opencontainers.image.source=https://github.com/msspranavasai/MLIRBench-CGO2027-AE \
            -t ghcr.io/msspranavasai/mlirbench-ae:0.3.0rc6 .
      - name: Verify package metadata actually installed in image
        run: |
          python3 -B tools/release/package_image_identity.py \
            --image ghcr.io/msspranavasai/mlirbench-ae:0.3.0rc6 \
            --platform 'linux/${{ matrix.arch }}'
      - name: Run native local-image quickstart twice
        env:
          AE_IMAGE_SOURCE: local
          AE_IMAGE: ghcr.io/msspranavasai/mlirbench-ae:0.3.0rc6
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          AE_OUTPUT_ROOT="$RUNNER_TEMP/results" ./ae.sh quickstart --output /results/first 2>&1 | tee "$RUNNER_TEMP/evidence/first.log"
          AE_OUTPUT_ROOT="$RUNNER_TEMP/results" ./ae.sh quickstart --output /results/second 2>&1 | tee "$RUNNER_TEMP/evidence/second.log"
          python3 -B tools/release/collect_evidence.py --arch '${{ matrix.arch }}' \
            --results "$RUNNER_TEMP/results/first" --output "$RUNNER_TEMP/evidence/native"
      - name: Export, remove only task-owned reference, load and run offline
        env:
          IMAGE: ghcr.io/msspranavasai/mlirbench-ae:0.3.0rc6
          AE_IMAGE_SOURCE: local
          AE_IMAGE: ghcr.io/msspranavasai/mlirbench-ae:0.3.0rc6
        run: |
          set -o pipefail
          docker save -o "$RUNNER_TEMP/candidate-image.tar" "$IMAGE"
          docker image rm "$IMAGE"
          docker load -i "$RUNNER_TEMP/candidate-image.tar"
          AE_OUTPUT_ROOT="$RUNNER_TEMP/results" ./ae.sh quickstart --output /results/reloaded 2>&1 | tee "$RUNNER_TEMP/evidence/reloaded.log"
          python3 -B tools/release/collect_evidence.py --arch '${{ matrix.arch }}' \
            --results "$RUNNER_TEMP/results/reloaded" --output "$RUNNER_TEMP/evidence/reloaded-native"
      - name: Retain actual reports, logs and identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rc6-native-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/evidence/
            ${{ runner.temp }}/results/
          if-no-files-found: warn
          retention-days: 90
