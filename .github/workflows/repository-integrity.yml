name: Repository consistency
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-consistency:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Inspect Python and release metadata
        run: |
          python3 --version
          python3 -B scripts/check_repo_consistency.py
      - name: Verify scientific/source preservation without packaged binary
        run: python3 -B release_tools/verify_distribution.py --source-only
